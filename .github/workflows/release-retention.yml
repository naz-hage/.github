name: Release Retention

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: release-retention
  cancel-in-progress: false

env:
  # Add repositories as owner/name entries separated by commas.
  TARGET_REPOSITORIES: "naz-hage/sdo,naz-hage/sdo-launcher"

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Delete old releases and workflow runs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.API_GITHUB_KEY }}
          script: |
            const keepReleases = 10;
            const keepWorkflowRuns = 25;
            const repositories = process.env.TARGET_REPOSITORIES
              .split(",")
              .map(value => value.trim())
              .filter(Boolean)
              .map(value => {
                const separator = value.indexOf("/");
                if (separator <= 0 || separator === value.length - 1) {
                  throw new Error(`Invalid repository: ${value}`);
                }

                return {
                  owner: value.slice(0, separator),
                  repo: value.slice(separator + 1)
                };
              });

            for (const repository of repositories) {
              const { owner, repo } = repository;
              core.info(`Cleaning ${owner}/${repo}`);

              const releases = await github.paginate(
                github.rest.repos.listReleases,
                {
                  owner,
                  repo,
                  per_page: 100
                }
              );

              for (const release of releases.slice(keepReleases)) {
                core.info(`Deleting release ${owner}/${repo}:${release.tag_name}`);
                await github.rest.repos.deleteRelease({
                  owner,
                  repo,
                  release_id: release.id
                });

                try {
                  await github.rest.git.deleteRef({
                    owner,
                    repo,
                    ref: `tags/${release.tag_name}`
                  });
                } catch (error) {
                  if (error.status === 404) {
                    core.warning(`Tag already missing: ${owner}/${repo}:${release.tag_name}`);
                  } else {
                    throw error;
                  }
                }
              }

              const workflowRuns = await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                {
                  owner,
                  repo,
                  status: "completed",
                  per_page: 100
                }
              );

              for (const run of workflowRuns
                .filter(run => run.id !== context.runId)
                .slice(keepWorkflowRuns)) {
                core.info(`Deleting workflow run ${owner}/${repo}:${run.id} (${run.name})`);
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id
                });
              }
            }
